<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Lord of Darkness Online</title><style id="css">
:root{--bg:#f1f3ec;--side:#e6eadc;--card:#fff;--text:#1d2118;--muted:#6f7766;--line:#d3d9c6;--accent:#3f7d20;--danger:#c93c3c;--gold:#b8860b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121611;--side:#1a2017;--card:#1e251b;--text:#e7ecdf;--muted:#8e9884;--line:#2d3628;--accent:#8fd14f;--danger:#ff7b7b;--gold:#ffd43b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121611;--side:#1a2017;--card:#1e251b;--text:#e7ecdf;--muted:#8e9884;--line:#2d3628;--accent:#8fd14f;--danger:#ff7b7b;--gold:#ffd43b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}
aside{width:270px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:16px 12px;overflow-y:auto}
.brand{font-weight:800;font-size:19px;margin:0 4px 12px;cursor:pointer}
input,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.btn{border:0;border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.del:hover{color:var(--danger);border-color:var(--danger)}
#new{width:100%;margin:10px 0}
.own{display:none}
body.owner .own{display:block}
body.owner .bar .own{display:inline-block}
body.owner .own.hide{display:none}
.cat{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 4px 4px}
.item{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:6px 8px;border-radius:6px;font:inherit;cursor:pointer}
.item:hover{background:var(--line)}
.item.on{background:var(--accent);color:var(--bg);font-weight:600}
main{flex:1;min-width:0;padding:20px 24px 60px;max-width:820px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
#menu{display:none}
h1.t{font-size:28px;margin:6px 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.view h2{margin:22px 0 6px;font-size:21px;border-bottom:1px solid var(--line);padding-bottom:4px}
.view h3{margin:16px 0 4px;font-size:17px}
.view .y{color:var(--gold)}
.view p{margin:8px 0}.view ul{padding-left:22px}
.view a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
.view a.miss{color:var(--danger)}
.edit{display:grid;gap:10px}
.edit textarea{min-height:340px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.hint{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:30px 0}
.home{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center}
.home h1{font-size:clamp(38px,10vw,76px);line-height:1.1;margin:0;color:var(--accent);font-weight:900}
@media(max-width:760px){
 aside{display:none;position:fixed;inset:0 20% 0 0;z-index:20;width:auto;box-shadow:4px 0 24px #0006;padding-top:calc(16px + env(safe-area-inset-top,0px))}
 aside.open{display:block}
 #menu{display:inline-block}
 main{padding:16px 14px 60px}
}
</style></head><body><div id="root"></div><script id="data" type="application/json">[{"id":1,"t":"GOLD","cat":"Genel","c":"Gold oyun içindeki para gibidir.\n\nZombilerden çıkar.\n\n## {sarı} Takasla nasıl alınır?\nTakasla gold almak için al-sat yaparsın.\n\n3’e aldığını 4’e satarsın. 300 tane deri aldın diye gidip bunu 10 golda verme! Daha fazlasına sat.\n\nvideo: https://youtu.be/4En2iaz8niM?si=AR2okENVM5yMTse2 Nasıl gold alınır?\n"},{"id":1793353836661,"t":"Zombiler","cat":"Zombiler","c":"Zombiler her yerde dir\n## ev bölgesi\nBurdaki zombiler güçsüzdür\nBurda Gold kasa bilirsin zombiler den \nAma nadir şansla düser\n## canvar bölgesi\nBurdaki zombiler daha güçlü dür artık \nSadece zombiler de çıkmaz haritada ayı ve kurtların cıktığı yerler gözükür \n## bilgi\nDüşen Eşyalar (Loot): Kumaş (%100), Yakut (%90), Kök/Yapışkan (%70), Paslı Metal (%60), İzole Bant (%50) ve düşük oranda altın/metal düşebilir.\n"}]</script><script id="app">
var SHELL='<div class="app"><aside id="side"><div class="brand" id="home">🏠 Ana Sayfa</div><button class="btn own" id="new">+ Yeni sayfa</button><div id="nav"></div></aside><main><div class="bar"><button class="btn ghost" id="menu">☰ Sayfalar</button><span style="flex:1"></span><button class="btn own hide" id="pub">💾 Yayınla</button><button class="btn ghost own" id="toggle">Düzenle</button><button class="btn ghost del own" id="del">Sil</button></div><div id="page"></div></main></div>';
var HEAD='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Lord of Darkness Online</title>';
var $=function(i){return document.getElementById(i)};
var pages=[],cur=null,editing=false,art=null,dirty=false;
try{pages=JSON.parse($("data").textContent)}catch(e){}
$("root").innerHTML=SHELL;
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function owner(){return document.body.classList.contains("owner")}
function mark(){dirty=true;$("pub").classList.remove("hide")}
function buildDoc(){
  var css=$("css").textContent,code=$("app").textContent;
  var data=JSON.stringify(pages).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="tr"><head>'+HEAD+'<style id="css">'+css+'</style></head><body><div id="root"></div><script id="data" type="application/json">'+data+'<\/script><script id="app">'+code+'<\/script></body></html>';
}
function byTitle(t){t=t.trim().toLowerCase();return pages.filter(function(p){return p.t.trim().toLowerCase()===t})[0]}
function get(){return pages.filter(function(p){return p.id===cur})[0]}
function inline(s){
  s=esc(s);
  s=s.replace(/\[\[([^\]]+)\]\]/g,function(m,n){var ok=byTitle(n);return '<a data-go="'+n.replace(/"/g,"&quot;")+'" class="'+(ok?"":"miss")+'">'+n+'</a>'});
  return s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>");
}
function md(src){
  var out="",inList=false;
  src.split("\n").forEach(function(l){
    var m;
    if((m=l.match(/^[-*] (.*)/))){if(!inList){out+="<ul>";inList=true}out+="<li>"+inline(m[1])+"</li>";return}
    if(inList){out+="</ul>";inList=false}
    if((m=l.match(/^## (.*)/))){var y=/^\{sarı\}\s*/.test(m[1]);out+="<h2"+(y?' class="y"':"")+">"+inline(m[1].replace(/^\{sarı\}\s*/,""))+"</h2>"}
    else if((m=l.match(/^### (.*)/)))out+="<h3>"+inline(m[1])+"</h3>";
    else if((m=l.match(/^video:\s*(https:\/\/\S+)\s*(.*)/i)))out+='<p><a href="'+esc(m[1])+'" target="_blank" rel="noopener">▶ '+esc(m[2].trim()||"Videoyu izle")+'</a></p>';
    else if(l.trim())out+="<p>"+inline(l)+"</p>";
  });
  if(inList)out+="</ul>";
  return out;
}
function nav(){
  var cats={};
  pages.forEach(function(p){var k=p.cat||"Kategorisiz";(cats[k]=cats[k]||[]).push(p)});
  var h="";
  Object.keys(cats).sort().forEach(function(k){
    h+='<div class="cat">'+esc(k)+'</div>';
    cats[k].sort(function(a,b){return a.t.localeCompare(b.t,"tr")}).forEach(function(p){
      h+='<button class="item'+(p.id===cur?" on":"")+'" data-id="'+p.id+'">'+esc(p.t||"Adsız")+'</button>';
    });
  });
  $("nav").innerHTML=h;
}
function show(){
  var p=get();nav();
  $("toggle").textContent=editing?"Bitti":"Düzenle";
  if(!p){$("page").innerHTML='<div class="home"><h1>Lord of Darkness Online</h1></div>';return}
  if(editing&&owner()){
    $("page").innerHTML='<div class="edit"><input id="et" placeholder="Sayfa başlığı"><input id="ec" placeholder="Kategori (örn. Genel, Yaratıklar, Mekanlar)"><textarea id="ex" placeholder="Buraya yaz…"></textarea><div class="hint">## Başlık · ## {sarı} Sarı başlık · ### Alt başlık · - liste · **kalın** · *italik* · [[Sayfa Adı]] bağlantı · video: https://youtu.be/... Buton yazısı</div></div>';
    $("et").value=p.t;$("ec").value=p.cat;$("ex").value=p.c;
    $("et").oninput=function(){p.t=this.value;mark();nav()};
    $("ec").oninput=function(){p.cat=this.value;mark();nav()};
    $("ex").oninput=function(){p.c=this.value;mark()};
  }else{
    $("page").innerHTML='<h1 class="t">'+esc(p.t||"Adsız")+'</h1><div class="sub">'+esc(p.cat||"Kategorisiz")+'</div><div class="view">'+(p.c.trim()?md(p.c):'<div class="empty">Bu sayfa boş.</div>')+'</div>';
  }
}
function go(id,ed){cur=id;editing=!!ed;$("side").classList.remove("open");show();window.scrollTo(0,0)}
function create(title,cat){var p={id:Date.now(),t:title||"Yeni sayfa",cat:cat||"Genel",c:""};pages.push(p);mark();go(p.id,true)}
document.addEventListener("click",function(e){
  var a=e.target.closest("[data-go]");
  if(a){var n=a.getAttribute("data-go"),p=byTitle(n);if(p)go(p.id,false);else if(owner())create(n,"");return}
  var it=e.target.closest(".item");if(it)go(+it.getAttribute("data-id"),false);
});
$("home").onclick=function(){go(null,false)};
$("menu").onclick=function(){$("side").classList.toggle("open")};
$("new").onclick=function(){create("","")};
$("toggle").onclick=function(){if(get()){editing=!editing;show()}};
$("del").onclick=function(){var p=get();if(!p)return;if(confirm("“"+(p.t||"Adsız")+"” sayfası silinsin mi?")){pages=pages.filter(function(x){return x!==p});mark();go(null,false)}};
$("pub").onclick=async function(){
  var b=this;if(!art)return;b.disabled=true;b.textContent="Yayınlanıyor…";
  try{await art.publish(buildDoc())}
  catch(e){b.disabled=false;b.textContent="💾 Yayınla";alert("Yayınlanamadı, tekrar dene.")}
};
window.addEventListener("beforeunload",function(e){if(dirty&&owner()){e.preventDefault();e.returnValue=""}});
show();
(async function(){
  try{
    if(!window.claude)return;
    var u=await claude.use("user");
    if(!u||!u.isOwner())return;
    var a=await claude.use("artifact");
    if(!a)return;
    art=a;document.body.classList.add("owner");show();
  }catch(e){}
})();
</script></body></html>
